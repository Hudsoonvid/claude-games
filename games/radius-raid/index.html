<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Radius Raid</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<link rel="shortcut icon" id="favicon" />

		<style>
			html, body {
				overflow: hidden;
				overscroll-behavior: none;
				touch-action: none;
				margin: 0;
			}

			body {
				background: #080808;
			}

			#wrap {
				background: #222;
				box-shadow: inset 0 0 0 1px #404040, 0 0 0 1px #000;
				left: 50%;
				opacity: 0;
				padding: 10px;		
				position: absolute;
				top: 50%;
				transition: opacity 1.5s;
			}

			.loaded #wrap {				
				opacity: 1;			
			}

			#wrap-inner {
				background: #000;				
				overflow: hidden;
				position: relative;				
			}

			canvas {
				cursor: crosshair;
				display: block;
				left: 0;
				position: absolute;
				top: 0;
			}
		</style>
	</head>
	<body>
		<div id="wrap">
			<div id="wrap-inner">
				<canvas id="cbg1"></canvas>
				<canvas id="cbg2"></canvas>
				<canvas id="cbg3"></canvas>
				<canvas id="cbg4"></canvas>
				<canvas id="cmg"></canvas>
				<canvas id="cfg"></canvas>
			</div>
		</div>
		<script>var $ = {};</script>
		<script src="js/jsfxr.js"></script>
		<script src="js/util.js"></script>
		<script src="js/storage.js"></script>
		<script src="js/definitions.js"></script>
		<script src="js/audio.js"></script>		
		<script src="js/text.js"></script>
		<script src="js/hero.js"></script>
		<script src="js/enemy.js"></script>
		<script src="js/bullet.js"></script>
		<script src="js/explosion.js"></script>
		<script src="js/powerup.js"></script>
		<script src="js/particle.js"></script>
		<script src="js/particleemitter.js"></script>
		<script src="js/textpop.js"></script>
		<script src="js/levelpop.js"></script>
		<script src="js/button.js"></script>
		<script src="js/game.js"></script>
		<script>window.ARCADE={id:"radius-raid",touch:"twin",pad:{start:80,x:70,y:77},keys:{up:38,down:40,left:37,right:39},buttons:[{label:"II",key:80}]};</script>
		<script src="../../shared/arcade-input.js"></script>
		<script>
		/* Arcade port adapter: fit-to-screen scaling, right-stick aiming, touch + gamepad menus. */
		(function () {
			var scale = 1, aiming = false, upTimer = 0;
			function fit() {
				scale = Math.min( window.innerWidth / 824, window.innerHeight / 624 );
				var wrap = document.getElementById( 'wrap' );
				wrap.style.transform = 'scale(' + scale + ')';
				if( $.cmg ) { $.resizecb(); }
			}
			window.addEventListener( 'resize', fit );
			window.addEventListener( 'orientationchange', fit );
			window.addEventListener( 'load', function() { fit(); setTimeout( fit, 300 ); } );

			$.mousescreen = function() {
				var aim = window.ArcadeInput && ArcadeInput.aim();
				if( aim && $.state == 'play' && $.hero ) {
					aiming = true;
					$.mouse.sx = $.hero.x + $.screen.x + aim[ 0 ] * 200;
					$.mouse.sy = $.hero.y + $.screen.y + aim[ 1 ] * 200;
					$.mouse.down = 1;
				} else {
					if( aiming ) { aiming = false; $.mouse.down = 0; }
					$.mouse.sx = ( $.mouse.ax - $.cOffset.left ) / scale;
					$.mouse.sy = ( $.mouse.ay - $.cOffset.top ) / scale;
				}
				$.mouse.x = $.mouse.sx - $.screen.x;
				$.mouse.y = $.mouse.sy - $.screen.y;
			};

			// Direct touch -> pointer mapping so menus and tap-to-shoot respond instantly.
			function touchAt( e, down ) {
				if( e.target.closest && e.target.closest( '.arc-touch, .arc-hub' ) ) { return; }
				var t = e.changedTouches[ 0 ];
				$.mouse.ax = t.pageX;
				$.mouse.ay = t.pageY;
				$.mousescreen();
				// Hold a quick tap "down" for a couple of frames so menu buttons see it.
				clearTimeout( upTimer );
				if( down ) { $.mouse.down = 1; }
				else { upTimer = setTimeout( function() { $.mouse.down = 0; }, 60 ); }
				e.preventDefault();
			}
			window.addEventListener( 'touchstart', function( e ) { touchAt( e, 1 ); }, { passive: false } );
			window.addEventListener( 'touchmove', function( e ) { touchAt( e, 1 ); }, { passive: false } );
			window.addEventListener( 'touchend', function( e ) { touchAt( e, 0 ); }, { passive: false } );

			// Gamepad: A picks the first menu button, B the last (usually "back").
			window.addEventListener( 'arcade-button', function( e ) {
				if( !e.detail.down || $.state == 'play' || !$.buttons || !$.buttons.length ) { return; }
				if( e.detail.name == 'a' ) { $.buttons[ 0 ].action(); }
				if( e.detail.name == 'b' ) { $.buttons[ $.buttons.length - 1 ].action(); }
			} );
		})();
		</script>
	</body>
</html>
